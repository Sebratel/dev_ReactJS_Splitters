# Variáveis: ficheiro .env.local na máquina (docker compose --env-file .env.docker)
# ou o painel "Environment" do Portainer (mesmos nomes; alimenta build args do frontend).
# Não é preciso ficheiro .env.docker no repositório.

name: nexaview

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexaview-backend
    environment:
      PORT: "3001"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      MASSIVA_MYSQL_HOST: ${MASSIVA_MYSQL_HOST}
      MASSIVA_MYSQL_PORT: ${MASSIVA_MYSQL_PORT:-3306}
      MASSIVA_MYSQL_DATABASE: ${MASSIVA_MYSQL_DATABASE}
      MASSIVA_MYSQL_USER: ${MASSIVA_MYSQL_USER}
      MASSIVA_MYSQL_PASSWORD: ${MASSIVA_MYSQL_PASSWORD}
      HUB_BASE_URL: ${HUB_BASE_URL}
      GEOGRID_BASE_URL: ${GEOGRID_BASE_URL}
      GEOGRID_API_KEY: ${GEOGRID_API_KEY}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - nexaview-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_LOCAL_BFF_URL: ${VITE_LOCAL_BFF_URL:-}
        VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL:-}
        VITE_BFF_PROXY_TARGET: ${VITE_BFF_PROXY_TARGET:-}
        VITE_HUB_ORIGIN: ${VITE_HUB_ORIGIN:-}
        VITE_HUB_SESSION_ENDPOINT: ${VITE_HUB_SESSION_ENDPOINT:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-}
        VITE_REVERSE_GEOCODE_ENDPOINT: ${VITE_REVERSE_GEOCODE_ENDPOINT:-}
        VITE_DEV_SESSION_TOKEN: ${VITE_DEV_SESSION_TOKEN:-}
        VITE_GEOGRID_BASE_URL: ${VITE_GEOGRID_BASE_URL:-}
        VITE_GEOGRID_API_KEY: ${VITE_GEOGRID_API_KEY:-}
        VITE_MASSIVA_LIST_PATH: ${VITE_MASSIVA_LIST_PATH:-}
        VITE_MASSIVA_OPEN_PATH: ${VITE_MASSIVA_OPEN_PATH:-}
        VITE_MASSIVA_CLOSE_PATH: ${VITE_MASSIVA_CLOSE_PATH:-}
        VITE_MASSIVA_AFETADOS_PATH: ${VITE_MASSIVA_AFETADOS_PATH:-}
        VITE_MASSIVA_AFFECTED_USERS_PATH: ${VITE_MASSIVA_AFFECTED_USERS_PATH:-}
        VITE_MASSIVA_CLOSE_INCIDENT_STATUS_ID: ${VITE_MASSIVA_CLOSE_INCIDENT_STATUS_ID:-}
        VITE_MASSIVA_CLOSE_PROGRESS: ${VITE_MASSIVA_CLOSE_PROGRESS:-}
        VITE_MASSIVA_CLOSE_PRIORITY: ${VITE_MASSIVA_CLOSE_PRIORITY:-}
        VITE_MASSIVA_CLOSE_NOTIFICATION_TARGET: ${VITE_MASSIVA_CLOSE_NOTIFICATION_TARGET:-}
        VITE_MASSIVA_CLOSE_PRIVATE_REPORT: ${VITE_MASSIVA_CLOSE_PRIVATE_REPORT:-}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_PATH: ${VITE_OIDC_REDIRECT_PATH:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
        VITE_AUTOISP_AUTH_ENDPOINT: ${VITE_AUTOISP_AUTH_ENDPOINT:-}
        VITE_AUTOISP_EVENTS_ENDPOINT: ${VITE_AUTOISP_EVENTS_ENDPOINT:-}
        VITE_AUTOISP_USERNAME: ${VITE_AUTOISP_USERNAME:-}
        VITE_AUTOISP_PASSWORD: ${VITE_AUTOISP_PASSWORD:-}
    container_name: nexaview-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexaview-network
    restart: unless-stopped

networks:
  nexaview-network:
    driver: bridge
