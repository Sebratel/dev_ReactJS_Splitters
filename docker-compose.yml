# Producao: Nginx (frontend) + API Node. Variaveis: copie a secao Docker de `.env.example` para `.env.docker`.
#   docker compose --env-file .env.docker up -d --build
#
# Portainer: faca o build num host com .env.docker no mesmo diretorio, ou
# anexa o ficheiro ao stack; o backend liga via env_file e o frontend e construido com
# o COPY .env.docker do Dockerfile.

name: nexaview

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexaview-backend
    environment:
      PORT: "3001"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      MASSIVA_MYSQL_HOST: ${MASSIVA_MYSQL_HOST}
      MASSIVA_MYSQL_PORT: ${MASSIVA_MYSQL_PORT:-3306}
      MASSIVA_MYSQL_DATABASE: ${MASSIVA_MYSQL_DATABASE}
      MASSIVA_MYSQL_USER: ${MASSIVA_MYSQL_USER}
      MASSIVA_MYSQL_PASSWORD: ${MASSIVA_MYSQL_PASSWORD}
      HUB_BASE_URL: ${HUB_BASE_URL}
      GEOGRID_BASE_URL: ${GEOGRID_BASE_URL}
      GEOGRID_API_KEY: ${GEOGRID_API_KEY}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - nexaview-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nexaview-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexaview-network
    restart: unless-stopped

networks:
  nexaview-network:
    driver: bridge
