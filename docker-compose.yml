name: nexaview

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexaview-backend
    environment:
      PORT: 3001
      # As demais variáveis vêm do .env.local
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - nexaview-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nexaview-frontend
    environment:
      # Dentro do container, 'backend' é o hostname do serviço
      VITE_LOCAL_BFF_URL: http://backend:3001
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexaview-network
    restart: unless-stopped
    
