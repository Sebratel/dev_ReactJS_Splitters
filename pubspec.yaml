name: nexaview
description: "Desvende a organização da sua rede com esta plataforma inovadora, que exibe detalhes essenciais de cada splitter e, com um clique ou QR scan, revela todos os clientes conectados de forma intuitiva e eficiente."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  shared_preferences: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shimmer: ^3.0.0
  mobile_scanner: ^7.1.3
  intl: ^0.20.2
  lottie: ^3.1.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  dart_jsonwebtoken: ^2.4.1
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.14.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/logo-sebratel.png
  remove_alpha_ios: true
  
