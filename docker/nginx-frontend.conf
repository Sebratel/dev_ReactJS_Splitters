# SPA + proxy do backend Node
server {
    listen 80;
    
    # CORREÇÃO: server_name não leva protocolo (https://)
    server_name splitters-monitoring.sebratel.net.br;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        # CORREÇÃO: Apontando para o backend de produção e não staging
        proxy_pass https://splitters-monitoring-backend.sebratel.net.br/; 
        
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        
        # CORREÇÃO: Host deve coincidir com o proxy_pass de produção
        proxy_set_header Host splitters-monitoring-backend.sebratel.net.br;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Paridade com vite.config.ts: /__autoisp/api/... → autoisp
    location /__autoisp/ {
        rewrite ^/__autoisp/(.*)$ /$1 break;
        proxy_pass https://autoisp.sebratel.net.br;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host autoisp.sebratel.net.br;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}