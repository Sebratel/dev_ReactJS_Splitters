name: nexaview

# Stack: backend + frontend sem Nginx de borda no compose.
# O browser acede ao frontend em FRONTEND_PORT (predefinido 3177) e opcionalmente ao backend em BACKEND_PORT.
# Dentro da imagem do frontend o Nginx serve o SPA na porta 3177. HTTPS na borda: Traefik, Cloudflare ou LB à parte.

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: react-backend-portainer
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      LOG_LEVEL: debug
      PORT: 3001
      ERP_CLIENT_ID: ${ERP_CLIENT_ID}
      ERP_CLIENT_SECRET: ${ERP_CLIENT_SECRET}
      ERP_SYNDATA: ${ERP_SYNDATA}
      MASSIVA_COOKIE_STRING: ${MASSIVA_COOKIE_STRING}
      MASSIVA_API_GATEWAY_ENDPOINT: ${MASSIVA_API_GATEWAY_ENDPOINT}
      MASSIVA_API_GATEWAY_LIST_ENDPOINT: ${MASSIVA_API_GATEWAY_LIST_ENDPOINT}
      # PostgreSQL - DESABILITADO (funciona sem estatísticas de rede)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      # PostgreSQL de monitoramento de ONUs (diagnóstico de sinal) — servidor separado
      ONU_DB_HOST: ${ONU_DB_HOST}
      ONU_DB_PORT: ${ONU_DB_PORT:-5432}
      ONU_DB_NAME: ${ONU_DB_NAME}
      ONU_DB_USER: ${ONU_DB_USER}
      ONU_DB_PASSWORD: ${ONU_DB_PASSWORD}
      ONU_DB_SSL: ${ONU_DB_SSL:-false}
      # MySQL remoto (do .env.local)
      MASSIVA_MYSQL_HOST: ${MASSIVA_MYSQL_HOST}
      MASSIVA_MYSQL_PORT: ${MASSIVA_MYSQL_PORT}
      MASSIVA_MYSQL_DATABASE: ${MASSIVA_MYSQL_DATABASE}
      MASSIVA_MYSQL_USER: ${MASSIVA_MYSQL_USER}
      MASSIVA_MYSQL_PASSWORD: ${MASSIVA_MYSQL_PASSWORD}
      ISA_PROMPT_MYSQL_AUTO_CREATE_TABLE: ${ISA_PROMPT_MYSQL_AUTO_CREATE_TABLE:-false}
      PLATFORM_SUGGESTIONS_MYSQL_AUTO_CREATE_TABLE: ${PLATFORM_SUGGESTIONS_MYSQL_AUTO_CREATE_TABLE:-false}
      PLATFORM_SUGGESTIONS_READ_ONLY: ${PLATFORM_SUGGESTIONS_READ_ONLY:-true}
      PLATFORM_SUGGESTIONS_APP_ID: ${PLATFORM_SUGGESTIONS_APP_ID:-app-splitters-sebratel}
      HUB_APPS_MYSQL_HOST: ${HUB_APPS_MYSQL_HOST:-}
      HUB_APPS_MYSQL_PORT: ${HUB_APPS_MYSQL_PORT:-3306}
      HUB_APPS_MYSQL_DATABASE: ${HUB_APPS_MYSQL_DATABASE:-DB_Hub_Apps}
      HUB_APPS_MYSQL_USER: ${HUB_APPS_MYSQL_USER:-}
      HUB_APPS_MYSQL_PASSWORD: ${HUB_APPS_MYSQL_PASSWORD:-}
      SUGGESTIONS_REPLICA_MYSQL_HOST: ${SUGGESTIONS_REPLICA_MYSQL_HOST:-}
      SUGGESTIONS_REPLICA_MYSQL_PORT: ${SUGGESTIONS_REPLICA_MYSQL_PORT:-3306}
      SUGGESTIONS_REPLICA_MYSQL_DATABASE: ${SUGGESTIONS_REPLICA_MYSQL_DATABASE:-}
      SUGGESTIONS_REPLICA_MYSQL_USER: ${SUGGESTIONS_REPLICA_MYSQL_USER:-}
      SUGGESTIONS_REPLICA_MYSQL_PASSWORD: ${SUGGESTIONS_REPLICA_MYSQL_PASSWORD:-}
      # APIs externas
      HUB_BASE_URL: ${HUB_BASE_URL}
      GEOGRID_BASE_URL: ${GEOGRID_BASE_URL}
      GEOGRID_API_KEY: ${GEOGRID_API_KEY}
      # AutoISP
      AUTOISP_EVENTS_ENDPOINT: ${AUTOISP_EVENTS_ENDPOINT}
      AUTOISP_AUTH_ENDPOINT: ${AUTOISP_AUTH_ENDPOINT}
      AUTOISP_USERNAME: ${AUTOISP_USERNAME}
      AUTOISP_PASSWORD: ${AUTOISP_PASSWORD}
      # Assistente ISA (Google Gemini). Sem GEMINI_API_KEY ou GOOGLE_API_KEY o POST /api/isa/planning-assistant/chat responde 503.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      FIREBASE_ADMIN_PROJECT_ID: ${FIREBASE_ADMIN_PROJECT_ID:-}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${FIREBASE_ADMIN_CLIENT_EMAIL:-}
      FIREBASE_ADMIN_PRIVATE_KEY: ${FIREBASE_ADMIN_PRIVATE_KEY:-}
      FIREBASE_ADMIN_PRIVATE_KEY_BASE64: ${FIREBASE_ADMIN_PRIVATE_KEY_BASE64:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      REVERSE_GEOCODE_USER_AGENT: ${REVERSE_GEOCODE_USER_AGENT:-}
      REVERSE_GEOCODE_ENDPOINT: ${REVERSE_GEOCODE_ENDPOINT:-}
      REVERSE_GEOCODE_DISABLED: ${REVERSE_GEOCODE_DISABLED:-}
      REVERSE_GEOCODE_TIMEOUT_MS: ${REVERSE_GEOCODE_TIMEOUT_MS:-}
      REVERSE_GEOCODE_NEIGHBORS_MAX: ${REVERSE_GEOCODE_NEIGHBORS_MAX:-}
      REVERSE_GEOCODE_NEIGHBORS_DELAY_MS: ${REVERSE_GEOCODE_NEIGHBORS_DELAY_MS:-}
    ports:
      - "${BACKEND_PORT:-3003}:3001"
    expose:
      - "3001"
    networks:
      - nexaview-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # IMPORTANTE: manter VAZIOS. O SPA chama `/api/...` no mesmo origin e o
        # frontend-server.mjs faz proxy para BACKEND_ORIGIN (sem CORS). Preencher
        # com a URL do backend faz o browser chamar cross-origin e cair em CORS.
        - VITE_BFF_BASE_URL=
        - VITE_LOCAL_BFF_URL=
        - VITE_GEOGRID_BASE_URL=${VITE_GEOGRID_BASE_URL}
        - VITE_GEOGRID_API_KEY=${VITE_GEOGRID_API_KEY}
        - VITE_BFF_PROXY_TARGET=${VITE_BFF_PROXY_TARGET}
        # Paths padrão do gateway Elleven (roteados via /api/v1 → GATEWAY_ORIGIN).
        # Sobrescreva pelo ambiente da stack só se o gateway usar outros paths.
        - VITE_MASSIVA_LIST_PATH=${VITE_MASSIVA_LIST_PATH:-/api/v1/massivas/recuperar-pelo-banco}
        - VITE_MASSIVA_OPEN_PATH=${VITE_MASSIVA_OPEN_PATH:-/api/v1/massivas/salvar-massiva-via-api}
        - VITE_MASSIVA_CLOSE_PATH=${VITE_MASSIVA_CLOSE_PATH:-/api/v1/massivas/finalizar-chamado-via-api}
        - VITE_MASSIVA_AFETADOS_PATH=${VITE_MASSIVA_AFETADOS_PATH:-/api/v1/afetados}
        - VITE_AUTOISP_AUTH_ENDPOINT=${VITE_AUTOISP_AUTH_ENDPOINT}
        - VITE_AUTOISP_EVENTS_ENDPOINT=${VITE_AUTOISP_EVENTS_ENDPOINT}
        - VITE_AUTOISP_USERNAME=${VITE_AUTOISP_USERNAME}
        - VITE_AUTOISP_PASSWORD=${VITE_AUTOISP_PASSWORD}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_GOOGLE_REDIRECT_URI=${VITE_GOOGLE_REDIRECT_URI}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_ACCESS_ALLOWED_EMAILS=${VITE_ACCESS_ALLOWED_EMAILS}
        - VITE_ACCESS_ALLOWED_EMAIL_DOMAIN=${VITE_ACCESS_ALLOWED_EMAIL_DOMAIN}
    container_name: react-frontend-portainer
    environment:
      # Proxy do BFF: o SPA chama `/api/...` e este servidor encaminha ao backend
      # pela rede interna do compose (sem expor o backend ao browser, sem CORS).
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:3001}
      # Gateway ERP/Elleven que atende `/api/v1/...` (massivas/afetados) — mesmo host usado
      # em dev no VITE_BFF_PROXY_TARGET (ex.: https://api-gateway-bff.sebratel.net.br).
      GATEWAY_ORIGIN: ${GATEWAY_ORIGIN:-}
      # Basic Auth do api-gateway-bff (ex.: admin/admin) — só no proxy server-side; evita popup no browser.
      GATEWAY_BASIC_AUTH_USER: ${GATEWAY_BASIC_AUTH_USER:-}
      GATEWAY_BASIC_AUTH_PASSWORD: ${GATEWAY_BASIC_AUTH_PASSWORD:-}
      # Opcional: proxy `/__autoisp/...` (deixe vazio se o app usa URLs absolutas do AutoISP).
      AUTOISP_ORIGIN: ${AUTOISP_ORIGIN:-}
      # Desenvolvimento local
      LOCAL_USER_EMAIL: dev@local
      LOCAL_USER_PERSON_ID: 629
      LOCAL_MASSIVA_ENABLED: "true"
    expose:
      - "3177"
    ports:
      - "${FRONTEND_PORT:-3177}:3177"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexaview-network
    restart: unless-stopped

networks:
  nexaview-network:
    driver: bridge
