name: nexaview

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: react-backend-portainer
    environment:
      NODE_ENV: production
      LOG_LEVEL: debug
      PORT: 3001
      ERP_CLIENT_ID: ${ERP_CLIENT_ID}
      ERP_CLIENT_SECRET: ${ERP_CLIENT_SECRET}
      ERP_SYNDATA: ${ERP_SYNDATA}
      MASSIVA_COOKIE_STRING: ${MASSIVA_COOKIE_STRING}
      MASSIVA_API_GATEWAY_ENDPOINT: ${MASSIVA_API_GATEWAY_ENDPOINT}
      MASSIVA_API_GATEWAY_LIST_ENDPOINT: ${MASSIVA_API_GATEWAY_LIST_ENDPOINT}
      # PostgreSQL - DESABILITADO (funciona sem estatísticas de rede)
      DB_HOST: ${DB_HOST:-186.219.128.248}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-dbemp00100}
      DB_USER: ${DB_USER:-cliente_s}
      DB_PASSWORD: ${DB_PASSWORD:-mHWIg8o1V:4v}
      DB_SSL: ${DB_SSL:-false}
      # MySQL remoto (do .env.local)
      MASSIVA_MYSQL_HOST: ${MASSIVA_MYSQL_HOST}
      MASSIVA_MYSQL_PORT: ${MASSIVA_MYSQL_PORT}
      MASSIVA_MYSQL_DATABASE: ${MASSIVA_MYSQL_DATABASE}
      MASSIVA_MYSQL_USER: ${MASSIVA_MYSQL_USER}
      MASSIVA_MYSQL_PASSWORD: ${MASSIVA_MYSQL_PASSWORD}
      # APIs externas
      HUB_BASE_URL: ${HUB_BASE_URL}
      GEOGRID_BASE_URL: ${GEOGRID_BASE_URL}
      GEOGRID_API_KEY: ${GEOGRID_API_KEY}
      # AutoISP
      AUTOISP_EVENTS_ENDPOINT: ${AUTOISP_EVENTS_ENDPOINT:-https://autoisp.sebratel.net.br/api/massives/v1/events}
      AUTOISP_AUTH_ENDPOINT: ${AUTOISP_AUTH_ENDPOINT:-https://autoisp.sebratel.net.br/api/auth/v2/request_token}
      AUTOISP_USERNAME: ${AUTOISP_USERNAME:-api@sebratel.com.br}
      AUTOISP_PASSWORD: ${AUTOISP_PASSWORD:-nqy!jzk7gwx_BUQ!qug}
    ports:
      - "3031:3001"
    networks:
      - nexaview-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_BFF_BASE_URL=${VITE_BFF_BASE_URL:-}
        - VITE_LOCAL_BFF_URL=${VITE_LOCAL_BFF_URL:-}
        - VITE_GEOGRID_BASE_URL=${VITE_GEOGRID_BASE_URL:-https://eros.geogridmaps.com.br/sebratel/api/v3}
        - VITE_GEOGRID_API_KEY=${VITE_GEOGRID_API_KEY:-395dce58e725b7324453608e6c65e8a6a8193e86}
        - VITE_BFF_PROXY_TARGET=${VITE_BFF_PROXY_TARGET:-https://n8n-staging.sebratel.net.br}
        - VITE_MASSIVA_LIST_PATH=${VITE_MASSIVA_LIST_PATH:-/api/v1/massivas/recuperar-pelo-banco}
        - VITE_MASSIVA_OPEN_PATH=${VITE_MASSIVA_OPEN_PATH:-/api/v1/massivas/salvar-massiva-via-api}
        - VITE_MASSIVA_AFETADOS_PATH=${VITE_MASSIVA_AFETADOS_PATH:-/api/v1/afetados}
        - VITE_AUTOISP_AUTH_ENDPOINT=${VITE_AUTOISP_AUTH_ENDPOINT:-/__autoisp/api/auth/v2/request_token}
        - VITE_AUTOISP_EVENTS_ENDPOINT=${VITE_AUTOISP_EVENTS_ENDPOINT:-/__autoisp/api/massives/v1/events}
        - VITE_AUTOISP_USERNAME=${VITE_AUTOISP_USERNAME:-api@sebratel.com.br}
        - VITE_AUTOISP_PASSWORD=${VITE_AUTOISP_PASSWORD:-nqy!jzk7gwx_BUQ!qug}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-374233629278-383pi1ga2ta3sge34nkd5sggpulq8qbc.apps.googleusercontent.com}
        - VITE_GOOGLE_REDIRECT_URI=${VITE_GOOGLE_REDIRECT_URI:-https://portainer-staging.sebratel.net.br/}
    container_name: react-frontend-portainer
    environment:
      # Desenvolvimento local
      LOCAL_USER_EMAIL: dev@local
      LOCAL_USER_PERSON_ID: 629
      LOCAL_MASSIVA_ENABLED: "true"
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexaview-network
    restart: unless-stopped

networks:
  nexaview-network:
    driver: bridge
