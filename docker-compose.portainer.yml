name: nexaview

# Stack completa: backend + frontend + Nginx de borda (proxy público).
# O browser usa apenas a porta EDGE_HTTP_PORT (80 por defeito). Frontend/backend ficam só na rede Docker.
# HTTPS: veja docker/nginx-edge/ssl/https.server.example e monte certificados.

services:
  nginx-edge:
    image: nginx:stable-alpine
    container_name: nexaview-nginx-edge-portainer
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      # - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx-edge/conf.d:/etc/nginx/conf.d:ro
      # TLS (opcional): guarde fullchain.pem e privkey.pem e descomente:
      # - ./docker/nginx-edge/ssl/certs:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_started
    networks:
      - nexaview-network
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: react-backend-portainer
    environment:
      NODE_ENV: production
      LOG_LEVEL: debug
      PORT: 3001
      ERP_CLIENT_ID: ${ERP_CLIENT_ID}
      ERP_CLIENT_SECRET: ${ERP_CLIENT_SECRET}
      ERP_SYNDATA: ${ERP_SYNDATA}
      MASSIVA_COOKIE_STRING: ${MASSIVA_COOKIE_STRING}
      MASSIVA_API_GATEWAY_ENDPOINT: ${MASSIVA_API_GATEWAY_ENDPOINT}
      MASSIVA_API_GATEWAY_LIST_ENDPOINT: ${MASSIVA_API_GATEWAY_LIST_ENDPOINT}
      # PostgreSQL - DESABILITADO (funciona sem estatísticas de rede)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      # MySQL remoto (do .env.local)
      MASSIVA_MYSQL_HOST: ${MASSIVA_MYSQL_HOST}
      MASSIVA_MYSQL_PORT: ${MASSIVA_MYSQL_PORT}
      MASSIVA_MYSQL_DATABASE: ${MASSIVA_MYSQL_DATABASE}
      MASSIVA_MYSQL_USER: ${MASSIVA_MYSQL_USER}
      MASSIVA_MYSQL_PASSWORD: ${MASSIVA_MYSQL_PASSWORD}
      # APIs externas
      HUB_BASE_URL: ${HUB_BASE_URL}
      GEOGRID_BASE_URL: ${GEOGRID_BASE_URL}
      GEOGRID_API_KEY: ${GEOGRID_API_KEY}
      # AutoISP
      AUTOISP_EVENTS_ENDPOINT: ${AUTOISP_EVENTS_ENDPOINT}
      AUTOISP_AUTH_ENDPOINT: ${AUTOISP_AUTH_ENDPOINT}
      AUTOISP_USERNAME: ${AUTOISP_USERNAME:-api@sebratel.com.br}
      AUTOISP_PASSWORD: ${AUTOISP_PASSWORD:-nqy!jzk7gwx_BUQ!qug}
    expose:
      - "3001"
    # Debug: expor API no host — descomente se precisar sem passar pelo nginx-edge
    # ports:
    #   - "3031:3001"
    networks:
      - nexaview-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_BFF_BASE_URL=${VITE_BFF_BASE_URL}
        - VITE_LOCAL_BFF_URL=${VITE_LOCAL_BFF_URL}
        - VITE_GEOGRID_BASE_URL=${VITE_GEOGRID_BASE_URL}
        - VITE_GEOGRID_API_KEY=${VITE_GEOGRID_API_KEY}
        - VITE_BFF_PROXY_TARGET=${VITE_BFF_PROXY_TARGET}
        - VITE_MASSIVA_LIST_PATH=${VITE_MASSIVA_LIST_PATH}
        - VITE_MASSIVA_OPEN_PATH=${VITE_MASSIVA_OPEN_PATH}
        - VITE_MASSIVA_CLOSE_PATH=${VITE_MASSIVA_CLOSE_PATH}
        - VITE_MASSIVA_AFETADOS_PATH=${VITE_MASSIVA_AFETADOS_PATH}
        - VITE_AUTOISP_AUTH_ENDPOINT=${VITE_AUTOISP_AUTH_ENDPOINT}
        - VITE_AUTOISP_EVENTS_ENDPOINT=${VITE_AUTOISP_EVENTS_ENDPOINT}
        - VITE_AUTOISP_USERNAME=${VITE_AUTOISP_USERNAME}
        - VITE_AUTOISP_PASSWORD=${VITE_AUTOISP_PASSWORD}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_GOOGLE_REDIRECT_URI=${VITE_GOOGLE_REDIRECT_URI}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_ACCESS_ALLOWED_EMAILS=${VITE_ACCESS_ALLOWED_EMAILS}
        - VITE_ACCESS_ALLOWED_EMAIL_DOMAIN=${VITE_ACCESS_ALLOWED_EMAIL_DOMAIN}
    container_name: react-frontend-portainer
    environment:
      # Desenvolvimento local
      LOCAL_USER_EMAIL: dev@local
      LOCAL_USER_PERSON_ID: 629
      LOCAL_MASSIVA_ENABLED: "true"
    expose:
      - "3177"
    # Debug: SPA direto no host — descomente para expor no host na porta 3177
    ports:
      - "${FRONTEND_PORT:-3177}:3177"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexaview-network
    restart: unless-stopped

networks:
  nexaview-network:
    driver: bridge
